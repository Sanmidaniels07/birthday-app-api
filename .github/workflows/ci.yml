name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate
        name: Generate Prisma client
        env:
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"

      - run: npm run typecheck
        name: Typecheck